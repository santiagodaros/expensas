name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a compilar y publicar (ej: v2.5.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # auto-tag.yml empuja el tag usando el GITHUB_TOKEN por defecto, que por
      # diseno de GitHub Actions no dispara otros workflows (evita loops). Por
      # eso este workflow tambien acepta un disparo manual (workflow_dispatch)
      # indicando el tag a compilar, en vez de depender solo de `push: tags`.
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build API sidecar
        run: |
          pip install -r api/requirements.txt pyinstaller
          pyinstaller --onefile --name api-server --paths . api_server.py
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries
          Copy-Item dist\api-server.exe frontend\src-tauri\binaries\api-server-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          tagName: ${{ steps.resolve.outputs.tag }}
          releaseName: 'Gestor de Consorcios ${{ steps.resolve.outputs.tag }}'
          releaseBody: |
            ## Cambios en esta versión

            Descargá el instalador `.exe` de abajo para actualizar.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
